# fly.toml - Revenue Brain AI Voice Bridge

app = "revenuebrain-bridge"
primary_region = "iad"  # Washington DC — closest to Arturo in FL + Twilio iad1

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false   # never sleep — WebSocket server must always be on
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"       # free tier
  memory = "256mb"
